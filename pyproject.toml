[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "creditflow"
version = "0.1.0"
description = "Synthetic lending lakehouse with governed data products"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4", "delta-spark>=3.2,<4"]
analytics = ["dbt-duckdb>=1.8,<1.10", "dbt-core>=1.8,<1.11"]

[project.scripts]
creditflow = "creditflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
creditflow = ['dashboard.html']
