name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src spark orchestration
      - name: End-to-end smoke test
        env:
          CREDITFLOW_TOKEN_KEY: synthetic-ci-key-never-production
        run: |
          creditflow generate --rows 1000
          creditflow run
          creditflow run
          creditflow export
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[analytics]'
      - run: python scripts/seed_dbt.py
      - run: dbt seed --project-dir analytics --profiles-dir analytics
      - run: dbt build --project-dir analytics --profiles-dir analytics
